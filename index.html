<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WeatherWorld — Clima Global</title>
    <meta
      name="description"
      content="Explorá el clima de cualquier lugar del planeta: pronóstico de 5 días, próximas 24 horas y un globo 3D interactivo."
    />

    <!-- PWA (el manifest lo agrega vite-plugin-pwa) -->
    <meta name="theme-color" content="#030614" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeatherWorld" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fuentes locales (src/styles/global.css) y la imagen del globo, que es el LCP: se piden en paralelo con el JS -->
    <link rel="preload" href="/src/assets/fonts/dm-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/syne-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/textures/tierra.webp" as="image" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
